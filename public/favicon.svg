<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Document body with rounded corners and folded top-right -->
  <path
    d="M7 3 h12 l7 7 v16 c0 2.2-1.8 4-4 4 H7 c-2.2 0-4-1.8-4-4 V7 c0-2.2 1.8-4 4-4 z"
    fill="#C8873B"
  />

  <!-- Top-right folded flap -->
  <path
    d="M19 3 v5 c0 1.2.8 2 2 2 h5 L19 3 z"
    fill="#FFFFFF"
  />

  <!-- Three white rounded text bars -->
  <!-- Line 1: Wide -->
  <rect x="8.5" y="14" width="13.5" height="2.6" rx="1.3" fill="#FFFFFF" />
  <!-- Line 2: Wide -->
  <rect x="8.5" y="18.5" width="13.5" height="2.6" rx="1.3" fill="#FFFFFF" />
  <!-- Line 3: Short (left-aligned) -->
  <rect x="8.5" y="23" width="7.5" height="2.6" rx="1.3" fill="#FFFFFF" />
</svg>
