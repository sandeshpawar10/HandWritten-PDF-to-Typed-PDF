name: Keep Render Backend Alive

on:
  schedule:
    # Run every 13 minutes to prevent Render free tier from sleeping
    # Render spins down after 15 minutes of inactivity
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          echo "🔔 Pinging backend at $(date)"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: GitHub-Actions-KeepAlive/1.0" \
            https://typeddoc.onrender.com/health)

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Backend is alive - HTTP $RESPONSE"
          else
            echo "⚠️ Backend responded with HTTP $RESPONSE"
            exit 1
          fi

      - name: Get Backend Status
        if: success()
        run: |
          echo "📊 Backend health status:"
          curl -s https://typeddoc.onrender.com/health | jq '.'
