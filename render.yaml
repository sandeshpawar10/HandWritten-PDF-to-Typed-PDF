services:
  - type: web
    name: typed-document-backend
    env: node
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
