services:
  - type: web
    name: typed-document-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && pip3 install -r requirements.txt
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: /health
