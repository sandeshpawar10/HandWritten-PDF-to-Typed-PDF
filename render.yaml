services:
  - type: web
    name: typed-document-backend
    env: node
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: FLAGS_allocator_strategy
        value: naive_best_fit
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
    healthCheckPath: /health
